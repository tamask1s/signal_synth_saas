# Included inside the shared www.timeonion.com HTTPS server.
location ~ ^/syn_sig_ra/v1/auth/(login|register|verify-email|resend-verification|password-reset/(request|complete))$ {
    limit_req zone=timeonion_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
}

location / {
    limit_req zone=timeonion_per_ip burst=60 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
}
